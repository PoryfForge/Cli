[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wecom-clean-cli"
version = "1.0.0"
description = "Preview and clean old temporary images on Windows WeCom servers"
requires-python = ">=3.9"
dependencies = ["pywinrm==0.5.0"]

[project.scripts]
wecom-clean = "wecom_clean:main"

[tool.setuptools]
packages = ["wecom_clean"]

[tool.setuptools.package-data]
wecom_clean = ["*.ps1"]
